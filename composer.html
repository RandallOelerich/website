/* =====================================================
   STICKY PAGE HEADER AND MENU
   ===================================================== */

   .site-header {
    position: sticky;
    top: 20px;
    z-index: 1000;

    margin: 0 -20px 30px;
    padding: 20px 20px 13px;

    background: rgba(10, 13, 15, 0);

  /*  border-bottom: 1px solid rgba(255, 255, 255, 0.16); */

  /*  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.30); */

    /* Slightly blurs the page behind the header */
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
}

/* Covers the space above the sticky header */

.site-header::before {
    content: "";

    position: absolute;
    top: -20px;
    left: 0;

    width: 100%;
    height: 20px;

    background: rgba(10, 13, 15, 0.88);

    pointer-events: none;
}

.site-header h1 {
    margin: 0 0 10px;
    color: #c0c0c0;
}

.site-header .site-navigation {
    margin: 0;
}

/* Menu text and links */

.site-header p,
.site-header a {
    color: #c0c0c0;
}


/* Mobile adjustments */

@media (max-width: 768px) {

    .site-header {
        top: 15px;
        margin-right: -10px;
        margin-left: -10px;
        padding: 15px 10px 12px;
    }

   .site-header::before {
        top: -15px;
        height: 15px;
    } 

}
        
  /* Non-scrolling fixed background image */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("images/bg-dark.jpg");
            background-size: cover;
            background-position: top center; /* Ensures top of background shows */
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Semi-transparent overlay for soft darkening */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45); /* Adjust opacity here */
            z-index: -1;
        }

        body {
            color: #dddddd;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            background: transparent; /* prevents layered background conflict */
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 0 20px;
        }

        a {
            color: #c0c0c0;
        }

        .quote {
            opacity: 0.85;
            margin-bottom: 25px;
            font-style: italic;
        }

        .sc-wrapper {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            text-align: center;
            opacity: 0.95;
        }

        .sc-wrapper iframe {
            width: 100%;
            height: 450px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            padding-top: 56.25%;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
        }

        .responsive-video {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }

        .responsive-video iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
                text-align: center;
            }

            body {
                font-size: 16px;
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                font-size: 15px;
            }

            .sc-wrapper iframe {
                height: 380px;
            }
        }
