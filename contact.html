<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="favicon16.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Randall Oelerich, contact, email">
    <meta name="author" content="Randall Oelerich">
    <meta name="description" content="Randall Oelerich's contact page">

    <title>Randall Oelerich Contact</title>

    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        body {
            margin: 0;
            padding: 0;

            background-image: url("images/bg-dark.jpg");
            background-size: cover;
            background-position: top center;
            background-attachment: fixed;
            background-repeat: no-repeat;

            color: #dddddd;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }


        /* Semi-transparent overlay over background */

        .overlay {
            background: rgba(0, 0, 0, 0.45);
            min-height: 100vh;
            padding: 20px;
        }


        /* Main page container */

        .container {
            max-width: 900px;
            margin: auto;
            padding: 0 20px;
        }


        h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 20px;
        }


        a {
            color: #c0c0c0;
        }

        a:hover {
            color: #ffffff;
        }


        /* =====================================================
           EMAIL ADDRESS
           ===================================================== */

        .email-section {
            margin-top: 25px;
            margin-bottom: 35px;
        }

        .email-section img {
            max-width: 100%;
            height: auto;
        }


        /* =====================================================
           CONTACT FORM
           ===================================================== */

        .contact-form {
            max-width: 600px;

            margin-top: 25px;
            margin-bottom: 50px;

            padding: 25px;

            background: rgba(0, 0, 0, 0.35);

            border: 1px solid rgba(235, 235, 235, 0.15);
            border-radius: 8px;
        }


        /* Individual form rows */

        .form-group {
            margin-bottom: 18px;
        }


        /* Form labels */

        .contact-form label {
            display: block;

            margin-bottom: 6px;

            color: #eeeeee;

            font-weight: bold;
        }


        /* Text boxes and message box */

        .contact-form input,
        .contact-form textarea {

            width: 100%;

            box-sizing: border-box;

            padding: 11px 12px;

            border: 1px solid #777777;
            border-radius: 5px;

            /* change the last value for amount of opacity */
            background: rgba(235, 235, 235, 0.80);

            color: #222222;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
        }


        /* Message box */

        .contact-form textarea {
            resize: vertical;
            min-height: 160px;
        }


        /* Highlight selected field */

        .contact-form input:focus,
        .contact-form textarea:focus {

            outline: none;

            border-color: #bbbbbb;

            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.15);
        }


        /* Send button */

        .contact-form button {

            padding: 11px 24px;

            border: 1px solid #999999;
            border-radius: 5px;

            background: #444444;

            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }


        .contact-form button:hover {
            background: #666666;
            border-color: #bbbbbb;
        }


        /* =====================================================
           TABLETS / SMALL SCREENS
           ===================================================== */

        @media (max-width: 768px) {

            h1 {
                font-size: 1.8rem;
                text-align: center;
            }

            .overlay {
                padding: 15px;
            }

            .container {
                padding: 0 10px;
            }

            .contact-form {
                padding: 20px;
            }

        }


        /* =====================================================
           PHONES
           ===================================================== */

        @media (max-width: 480px) {

            body {
                font-size: 15px;
            }

            .contact-form {
                padding: 16px;
            }

        }

    </style>

</head>


<body>

<div class="overlay">

    <div class="container">


        <!-- PAGE TITLE -->

        <h1>Randall Oelerich - Contact</h1>


        <!-- NAVIGATION -->

        <p>
            <a href="index.html">Home</a> |
            <a href="composer.html">Composing</a> |
            <a href="reel.html">Reel</a> | 
            <b>Contact</b>
        </p>


        <!-- INTRODUCTION -->

       
        <!-- EMAIL ADDRESS -->

       
        <!-- CONTACT FORM -->

        <form
            class="contact-form"
            action="https://formspree.io/f/mzdlqljg"
            method="POST"
        >


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- SUBJECT -->

            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                >

            </div>


            <!-- MESSAGE -->

            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="7"
                    required
                ></textarea>

            </div>


            <!-- SEND BUTTON -->

            <button type="submit">
                Send Message
            </button>


        </form>


    </div>

</div>

</body>

</html>
